name: Wire email sender

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add email sender script to app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="email-send.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "soil-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Wire one-tap email sender into app"
          git push
