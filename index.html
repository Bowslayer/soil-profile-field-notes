<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soil Profile Field Notes</title><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{margin:0;background:#f6f7f8;color:#111}header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:5}h1{margin:0;font-size:1.25rem}main{padding:16px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:10px}textarea{min-height:74px}button{padding:11px 14px;border-radius:12px;border:1px solid #999;background:#fff}button.primary{background:#111;color:#fff;border-color:#111}.row{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px 12px;border-radius:10px;background:#eef1f4;margin-top:10px}.question{font-size:1.1rem;font-weight:700;margin:8px 0}.muted{color:#666;font-size:.9rem}.horizon{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.active-field{outline:3px solid currentColor;outline-offset:2px}</style></head><body><header><h1>Soil Profile Field Notes</h1><div class="muted">Build 2026-09-02 · Munsell 10YR Voice Format</div></header><main><section class="card"><div class="row"><button class="primary" id="startVoice">Start Hands-Free</button><button id="stopVoice">Stop</button><button id="newBlank">New / Blank Worksheet</button><button id="testVoice">Test Voice</button><button id="testMic">Test Microphone</button><button id="nextBtn">Next</button><button id="exampleBtn">Give Me an Example</button></div><div class="status" id="voiceStatus">Ready.</div><div class="question" id="currentQuestion"></div><div class="muted">Say “options,” “choices,” or “example” to hear examples. The final horizon does not have a Boundary field.</div></section><section class="card"><h2>Test Pit Details</h2><div class="grid"><div><label>Location</label><input id="location"></div><div><label>Lot / Tract / Parcel</label><input id="lotTract"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div><div><label>Elevation (ft)</label><input id="elevation"></div><div><label>Aspect</label><input id="aspect"></div><div><label>County</label><input id="county"></div><div><label>Soil Reviewer</label><input id="describedBy" value="JJ Conner"></div><div><label>Latitude</label><input id="latitude"></div><div><label>Longitude</label><input id="longitude"></div></div><div style="margin-top:10px"><label>Vegetation</label><textarea id="vegetation"></textarea></div><div class="row" style="margin-top:10px"><button id="gpsBtn">Refresh GPS + Elevation + County</button></div></section><section class="card"><h2>Soil Horizons</h2><div id="horizons"></div></section><section class="card"><button class="primary" id="saveJson">Save Field Notes JSON</button></section></main><script>
const $=id=>document.getElementById(id);const state={horizons:[],voiceActive:false,qIndex:0,mode:'answer',pending:null,depthsSet:false,recognition:null,speaking:false,retry:null};
const detailFields=[['location','What is the test pit location?'],['lotTract','What is the Lot, Tract, or Parcel?'],['aspect','What is the aspect?'],['county','What county is the test pit in?'],['vegetation','Describe the vegetation.']];
const horizonFields=[['dryColor','What is the dry Munsell color for Horizon {n}?'],['moistColor','What is the moist Munsell color for Horizon {n}?'],['structure','What is the soil structure for Horizon {n}?'],['texture','What is the soil texture for Horizon {n}?'],['dryConsistence','What is the dry consistence for Horizon {n}?'],['moistConsistence','What is the moist consistence for Horizon {n}?'],['wetConsistence','What is the wet consistence for Horizon {n}?'],['stickiness','What is the stickiness for Horizon {n}?'],['boundaryDistinctness','What is the boundary for Horizon {n}?'],['rockPercent','What percent rock fragments are present in Horizon {n}?'],['rockSize','What is the largest rock size for Horizon {n}?'],['rootsNotes','Describe the roots or other notes for Horizon {n}?']];
const examples={location:'For example, Test Pit 1, north test pit, or replacement area test pit.',lotTract:'For example, Tract A1A, Lot 3, or Parcel 2.',aspect:'Options are north, northeast, east, southeast, south, southwest, west, northwest, or level.',county:'For example, Broadwater, Gallatin, Lewis and Clark, or the county you are working in.',vegetation:'Examples include native grass, sagebrush, pasture grass, alfalfa, pine, juniper, or bare ground.',dryColor:'10YR is filled automatically. Say only the value and chroma, such as 5 2. I will enter 10YR 5/2.',moistColor:'10YR is filled automatically. Say only the value and chroma, such as 9 8. I will enter 10YR 9/8.',structure:'Options include single grain, massive, platy, prismatic, columnar, angular blocky, subangular blocky, granular, weak fine granular, moderate medium granular, or strong fine granular.',texture:'Options are sand, loamy sand, sandy loam, loam, silt loam, silt, sandy clay loam, clay loam, silty clay loam, sandy clay, silty clay, or clay.',dryConsistence:'Options include loose, soft, slightly hard, hard, very hard, or extremely hard.',moistConsistence:'Options include loose, very friable, friable, firm, very firm, or extremely firm.',wetConsistence:'Options include nonplastic, slightly plastic, moderately plastic, or very plastic.',stickiness:'Options include nonsticky, slightly sticky, moderately sticky, or very sticky.',boundaryDistinctness:'Options are abrupt, clear, gradual, or diffuse.',rockPercent:'Give the estimated volume percent, for example 5 percent, 20 percent, 40 percent, or 65 percent.',rockSize:'Give the actual observed maximum size, for example up to 5 inches or up to 10 inches.',rootsNotes:'Examples include few fine roots, common medium roots, many fine roots, no roots, mottles present, or other field notes.'};
const vocab={structure:['single grain','massive','weak fine granular','weak medium granular','moderate fine granular','moderate medium granular','strong fine granular','strong medium granular','platy','prismatic','columnar','angular blocky','subangular blocky','granular','structureless'],texture:['sand','loamy sand','sandy loam','loam','silt loam','silt','sandy clay loam','clay loam','silty clay loam','sandy clay','silty clay','clay'],dryConsistence:['loose','soft','slightly hard','hard','very hard','extremely hard'],moistConsistence:['loose','very friable','friable','firm','very firm','extremely firm'],wetConsistence:['nonplastic','slightly plastic','moderately plastic','very plastic'],stickiness:['nonsticky','slightly sticky','moderately sticky','very sticky'],boundaryDistinctness:['abrupt','clear','gradual','diffuse']};
const aliases={'sandy long':'sandy loam','sandy loan':'sandy loam','sandy loom':'sandy loam','clay loan':'clay loam','silty loan':'silt loam','non sticky':'nonsticky','slightly stick':'slightly sticky','very stick':'very sticky','sub angular blocky':'subangular blocky','single-grain':'single grain'};
function words(s){return String(s).toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim()}function dist(a,b){a=words(a);b=words(b);const m=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}function closest(t,list){const x=aliases[words(t)]||words(t);let best=list[0],score=1e9;for(const v of list){const s=dist(x,v);if(s<score){score=s;best=v}}return best}
function normalizeColor(t){const numberWords={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};let s=String(t).toLowerCase().replace(/ten\s*y\s*r|10\s*y\s*r|10yr/g,'').replace(/slash|dash|hyphen/g,'/').replace(/-/g,'/').trim();s=s.split(/\s+/).map(v=>numberWords[v]??v).join(' ');const n=s.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);return n?`10YR ${n[1]}/${n[2]}`:'10YR'}function normalizeRockSize(t){const n=String(t).match(/\d+(?:\.\d+)?/);return n?`up to ${n[0]} in`:t}function normalizeLotTract(t){return String(t).trim().replace(/\b(partial|parcel)\b/gi,'Parcel').replace(/\b(tracked|track|tract)\b/gi,'Tract').replace(/\blot\b/gi,'Lot')}function normalizeAnswer(key,t){if(key==='lotTract')return normalizeLotTract(t);if(key==='dryColor'||key==='moistColor')return normalizeColor(t);if(key==='rockPercent'){const n=String(t).match(/\d+(?:\.\d+)?/);return n?n[0]+'%':t}if(key==='rockSize')return normalizeRockSize(t);if(vocab[key])return closest(t,vocab[key]);return t}
const pad=n=>String(n).padStart(2,'0');function defaults(){const d=new Date();$('date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;$('time').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;$('describedBy').value='JJ Conner'}async function fetchWithTimeout(url,ms=5000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{signal:c.signal,cache:'no-store'})}finally{clearTimeout(timer)}}async function autoGPS(){if(!navigator.geolocation)return;return new Promise(res=>navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;$('latitude').value=lat.toFixed(6);$('longitude').value=lon.toFixed(6);try{const r=await fetchWithTimeout(`https://epqs.nationalmap.gov/v1/json?x=${lon}&y=${lat}&units=Feet&wkid=4326`);const d=await r.json();if(Number.isFinite(+d.value))$('elevation').value=Math.round(+d.value)}catch(e){}try{const r=await fetchWithTimeout(`https://geocoding.geo.census.gov/geocoder/geographies/coordinates?x=${lon}&y=${lat}&benchmark=Public_AR_Current&vintage=Current_Current&format=json`);const d=await r.json();$('county').value=(d?.result?.geographies?.Counties?.[0]?.NAME||'').replace(/ County$/i,'')}catch(e){}save();res()},()=>res(),{enableHighAccuracy:true,timeout:12000,maximumAge:0}))}
function blank(d={}){return Object.assign({top:'',bottom:'',dryColor:'10YR',moistColor:'10YR',structure:'',texture:'',dryConsistence:'',moistConsistence:'',wetConsistence:'',stickiness:'',boundaryDistinctness:'',rockPercent:'',rockSize:'',rootsNotes:''},d)}function label(k){return({top:'Top Depth',bottom:'Bottom Depth',dryColor:'Dry Color',moistColor:'Moist Color',structure:'Structure',texture:'Texture',dryConsistence:'Dry Consistence',moistConsistence:'Moist Consistence',wetConsistence:'Wet Consistence',stickiness:'Stickiness',boundaryDistinctness:'Boundary',rockPercent:'Rock %',rockSize:'Rock Size',rootsNotes:'Roots / Notes'})[k]||k}
function fieldsForHorizon(i){return horizonFields.filter(([k])=>!(i===state.horizons.length-1&&k==='boundaryDistinctness'))}function render(){horizons.innerHTML='';state.horizons.forEach((h,i)=>{const e=document.createElement('div');e.className='horizon';e.innerHTML=`<h3>Horizon ${i+1}</h3><div class="grid"></div>`;const g=e.querySelector('.grid');[['top'],['bottom'],...fieldsForHorizon(i)].forEach(([k])=>{const w=document.createElement('div');w.innerHTML=`<label>${label(k)}</label><input data-h="${i}" data-k="${k}">`;const x=w.querySelector('input');x.value=h[k]||'';x.oninput=()=>{h[k]=x.value;save()};g.appendChild(w)});horizons.appendChild(e)});buildQ()}let qs=[];function buildQ(){qs=detailFields.map(([key,q])=>({scope:'detail',key,q}));state.horizons.forEach((h,i)=>fieldsForHorizon(i).forEach(([key,q])=>qs.push({scope:'horizon',i,key,q:q.replace('{n}',i+1)})))}function val(q){return q.scope==='detail'?$(q.key).value:state.horizons[q.i][q.key]}function elem(q){return q.scope==='detail'?$(q.key):document.querySelector(`[data-h="${q.i}"][data-k="${q.key}"]`)}function focus(q){document.querySelectorAll('.active-field').forEach(x=>x.classList.remove('active-field'));const e=elem(q);if(e){e.classList.add('active-field');setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'center'}),30)}}function closeMic(){clearTimeout(state.retry);state.retry=null;const r=state.recognition;state.recognition=null;if(r)try{r.onend=r.onerror=r.onresult=null;r.abort()}catch(e){}}function speak(t,done){closeMic();state.speaking=true;if(!('speechSynthesis'in window)){state.speaking=false;done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.12;u.onend=u.onerror=()=>{state.speaking=false;done&&done()};speechSynthesis.speak(u)}function listen(){if(!state.voiceActive||state.speaking)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceStatus.textContent='Speech recognition is unavailable.';return}closeMic();const r=new SR();state.recognition=r;r.lang='en-US';r.continuous=false;r.interimResults=false;let got=false;r.onstart=()=>voiceStatus.textContent='Listening…';r.onresult=e=>{got=true;state.recognition=null;handle(e.results[0][0].transcript.trim())};const retry=()=>{if(!got&&state.voiceActive&&!state.speaking){voiceStatus.textContent='Reconnecting microphone…';clearTimeout(state.retry);state.retry=setTimeout(listen,300)}};r.onerror=e=>{if(state.recognition===r)state.recognition=null;if(e.error==='not-allowed'||e.error==='service-not-allowed'){state.voiceActive=false;voiceStatus.textContent='Microphone permission blocked.'}else retry()};r.onend=()=>{if(state.recognition===r)state.recognition=null;retry()};try{r.start()}catch(e){retry()}}
function currentQ(){return qs[state.qIndex]||null}function firstIntroBlank(){for(let i=0;i<detailFields.length;i++){const key=detailFields[i][0];if(!String($(key).value||'').trim())return i}return-1}function firstHorizonBlank(){for(let i=0;i<qs.length;i++)if(qs[i].scope==='horizon'){const v=String(val(qs[i])||'').trim();if(!v||((qs[i].key==='dryColor'||qs[i].key==='moistColor')&&/^10YR$/i.test(v)))return i}return-1}function nextStep(delay=120){setTimeout(()=>{if(!state.voiceActive)return;const ib=firstIntroBlank();if(ib>=0){state.qIndex=ib;return ask()}if(!state.depthsSet)return askDepths();const hb=firstHorizonBlank();if(hb>=0){state.qIndex=hb;return ask()}voiceStatus.textContent='All questions are filled.';currentQuestion.textContent='All questions are filled.'},delay)}function ask(){const q=currentQ();if(!q)return nextStep();const existing=String(val(q)||'').trim();if(existing&&!(q.scope==='horizon'&&(q.key==='dryColor'||q.key==='moistColor')&&/^10YR$/i.test(existing)))return nextStep();state.mode='answer';state.pending=null;currentQuestion.textContent=q.q;focus(q);speak(q.q,()=>setTimeout(listen,100))}function askDepths(){state.mode='depths';state.pending=null;currentQuestion.textContent='What are the depths of all the soil horizons?';document.querySelectorAll('.active-field').forEach(x=>x.classList.remove('active-field'));$('horizons').scrollIntoView({behavior:'smooth',block:'center'});speak('What are the depths of all the soil horizons?',()=>setTimeout(listen,100))}function setDepths(t){const n=(t.match(/\d+(?:\.\d+)?/g)||[]);if(n.length<2){speak('Please say the horizon depths again.',()=>listen());return}const r=[];for(let i=0;i+1<n.length;i+=2)r.push([n[i],n[i+1]]);state.horizons=r.map(x=>blank({top:x[0],bottom:x[1]}));state.depthsSet=true;render();save();state.mode='depthConfirm';state.pending=r;speak(r.map(x=>x[0]+' to '+x[1]).join(', ')+'. Is that correct?',()=>setTimeout(listen,100))}function apply(t){const q=currentQ();if(!q)return t;const v=normalizeAnswer(q.key,t);if(q.scope==='detail')$(q.key).value=v;else state.horizons[q.i][q.key]=v;const e=elem(q);if(e)e.value=v;save();focus(q);return v}function yes(x){return /^(yes|yeah|yep|correct|right|good|that is correct)$/.test(x)}function no(x){return /^(no|wrong|correct it|change it|not correct)$/.test(x)}function isExample(x){return x==='example'||x==='examples'||x==='give me an example'||x==='give me example'||x==='what are the examples'||x==='what are my choices'||x==='choices'||x==='choice'||x==='options'||x==='option'||x==='give me the options'||x==='give me options'||x==='what are the options'||x==='tell me the options'}function giveExample(){const q=currentQ();const text=q?(examples[q.key]||'Give the field observation for this item.'):'For horizon depths, say each range, for example 0 to 10, 10 to 55, 55 to 72.';voiceStatus.textContent='Reading options…';speak(text,()=>setTimeout(listen,120))}function handle(t){closeMic();const x=words(t);if(isExample(x)){if(state.mode==='confirm'){state.mode='answer';state.pending=null}return giveExample()}if(state.mode==='depths')return setDepths(t);if(state.mode==='depthConfirm'){if(yes(x)){state.mode='answer';return nextStep()}if(no(x)){state.depthsSet=false;state.horizons=[];render();save();return askDepths()}return setDepths(t)}if(state.mode==='confirm'){if(no(x)){state.mode='correct';voiceStatus.textContent='Listening for correction…';return setTimeout(listen,80)}if(yes(x)){state.mode='answer';state.pending=null;return nextStep()}const v=apply(t);state.pending=v;return speak(v+'. Is that correct?',()=>setTimeout(listen,100))}if(state.mode==='correct'){const v=apply(t);state.pending=v;state.mode='confirm';return speak(v+'. Is that correct?',()=>setTimeout(listen,100))}if(x==='next')return nextStep();const v=apply(t);state.pending=v;state.mode='confirm';speak(v+'. Is that correct?',()=>setTimeout(listen,100))}
async function start(){closeMic();state.voiceActive=true;defaults();voiceStatus.textContent='Preparing automatic fields…';await autoGPS();buildQ();nextStep(50)}function stop(){state.voiceActive=false;closeMic();state.speaking=false;if('speechSynthesis'in window)speechSynthesis.cancel();voiceStatus.textContent='Stopped.'}function save(){try{localStorage.setItem('soilNotesV10',JSON.stringify({horizons:state.horizons,depthsSet:state.depthsSet,location:$('location').value,lotTract:$('lotTract').value,date:$('date').value,time:$('time').value,elevation:$('elevation').value,aspect:$('aspect').value,county:$('county').value,vegetation:$('vegetation').value,describedBy:$('describedBy').value,latitude:$('latitude').value,longitude:$('longitude').value}))}catch(e){}}function load(){try{const d=JSON.parse(localStorage.getItem('soilNotesV10')||localStorage.getItem('soilNotesV9')||'null');if(!d)return;['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>{if(d[k]!=null)$(k).value=d[k]});state.horizons=(d.horizons||[]).map(h=>{const x=blank(h);delete x.boundaryTopography;if(!String(x.dryColor||'').trim())x.dryColor='10YR';if(!String(x.moistColor||'').trim())x.moistColor='10YR';return x});state.depthsSet=!!d.depthsSet||(state.horizons.length>0&&state.horizons.every(h=>h.top&&h.bottom))}catch(e){}}function safeFileName(s){return String(s||'Soil-Profile-Field-Notes').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').slice(0,120)||'Soil-Profile-Field-Notes'}function saveJSON(){const data={horizons:state.horizons.map((h,i)=>{const x={...h};if(i===state.horizons.length-1)delete x.boundaryDistinctness;return x}),depthsSet:state.depthsSet};['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>data[k]=$(k).value);const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=safeFileName($('lotTract').value)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function newBlank(){stop();try{localStorage.removeItem('soilNotesV10');localStorage.removeItem('soilNotesV9')}catch(e){}state.horizons=[];state.depthsSet=false;state.qIndex=0;state.mode='answer';state.pending=null;['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>$(k).value='');defaults();render();currentQuestion.textContent='';voiceStatus.textContent='Blank worksheet ready.';await autoGPS();save();}
async function testMic(){voiceStatus.textContent='Checking microphone…';try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());voiceStatus.textContent='Microphone is working.'}catch(e){voiceStatus.textContent='Microphone blocked.'}}function testVoice(){speak('Voice is working.',()=>voiceStatus.textContent='Voice test finished.')}
$('startVoice').onclick=start;$('stopVoice').onclick=stop;$('newBlank').onclick=newBlank;$('testVoice').onclick=testVoice;$('testMic').onclick=testMic;$('nextBtn').onclick=()=>nextStep();$('exampleBtn').onclick=giveExample;$('gpsBtn').onclick=autoGPS;$('saveJson').onclick=saveJSON;document.addEventListener('input',save);load();render();defaults();const blankRequested=new URLSearchParams(location.search).get('blank')==='1';if(blankRequested)setTimeout(newBlank,50);else setTimeout(()=>autoGPS(),400);if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
