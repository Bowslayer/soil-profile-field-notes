<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soil Profile Field Notes</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{margin:0;background:#f6f7f8;color:#111}header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:5}h1{margin:0;font-size:1.25rem}main{padding:16px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff}textarea{min-height:74px}button{padding:11px 14px;border-radius:12px;border:1px solid #999;background:#fff}button.primary{background:#111;color:#fff;border-color:#111}.row{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:.95rem;padding:10px 12px;border-radius:10px;background:#eef1f4;margin-top:10px}.question{font-size:1.1rem;font-weight:700;margin:8px 0}.muted{color:#666;font-size:.9rem}.horizon{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}</style></head><body><header><h1>Soil Profile Field Notes</h1><div class="muted">Build 2026-09-02 3:06 PM · Voice Fix</div></header><main><section class="card"><div class="row"><button class="primary" id="startVoice">Start Hands-Free</button><button id="stopVoice">Stop</button><button id="testVoice">Test Voice</button><button id="testMic">Test Microphone</button><button id="nextBtn">Next</button><button id="exampleBtn">Give Me an Example</button></div><div class="status" id="voiceStatus">Ready. Tap Test Voice first.</div><div class="muted" id="securityStatus" style="margin-top:8px"></div><div class="question" id="currentQuestion"></div><div class="muted">The app asks each question, listens for your answer, repeats what it heard, then continues. You can also say “next” or “give me an example.”</div></section><section class="card"><h2>Test Pit Details</h2><div class="grid"><div><label>Location</label><input id="location"></div><div><label>Lot / Tract</label><input id="lotTract"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div><div><label>Elevation</label><input id="elevation"></div><div><label>Aspect</label><input id="aspect"></div><div><label>County</label><input id="county"></div><div><label>Soil Reviewer</label><input id="describedBy" value="JJ Conner"></div><div><label>Latitude</label><input id="latitude"></div><div><label>Longitude</label><input id="longitude"></div></div><div style="margin-top:10px"><label>Vegetation</label><textarea id="vegetation"></textarea></div><div class="row" style="margin-top:10px"><button id="gpsBtn">Use Current GPS</button></div></section><section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Soil Horizons</h2><button id="addHorizon">Add Horizon</button></div><div id="horizons"></div></section><section class="card"><div class="row"><button class="primary" id="saveJson">Save Field Notes JSON</button><button id="loadJsonBtn">Load JSON</button><input id="loadJson" type="file" accept=".json,application/json" hidden></div></section></main><script>
const $=id=>document.getElementById(id),state={horizons:[],voiceActive:false,qIndex:0,recognition:null,waiting:false};
const detailFields=[["location","What is the test pit location?"],["lotTract","What is the lot or tract?"],["elevation","What is the elevation?"],["aspect","What is the aspect?"],["county","What county is the test pit in?"],["vegetation","Describe the vegetation."]];
const horizonFields=[["top","What is the top depth for Horizon {n}?"],["bottom","What is the bottom depth for Horizon {n}?"],["dryColor","What is the dry Munsell color for Horizon {n}?"],["moistColor","What is the moist Munsell color for Horizon {n}?"],["structure","What is the soil structure for Horizon {n}?"],["texture","What is the soil texture for Horizon {n}?"],["dryConsistence","What is the dry consistence for Horizon {n}?"],["moistConsistence","What is the moist consistence for Horizon {n}?"],["wetConsistence","What is the wet consistence for Horizon {n}?"],["stickiness","What is the stickiness for Horizon {n}?"],["boundaryDistinctness","What is the boundary distinctness for Horizon {n}?"],["boundaryTopography","What is the boundary topography for Horizon {n}?"],["rockPercent","What percent rock fragments are present in Horizon {n}?"],["rockSize","What is the rock fragment size for Horizon {n}?"],["rootsNotes","Describe the roots or other notes for Horizon {n}?"]];
const examples={structure:"Examples include massive, platy, prismatic, columnar, blocky, granular, or structureless.",texture:"Examples include sand, loamy sand, sandy loam, loam, silt loam, clay loam, sandy clay, silty clay, or clay.",dryConsistence:"Examples include loose, soft, slightly hard, hard, very hard, or extremely hard.",moistConsistence:"Examples include loose, very friable, friable, firm, very firm, or extremely firm.",stickiness:"Examples include nonsticky, slightly sticky, moderately sticky, or very sticky.",boundaryDistinctness:"Examples include abrupt, clear, gradual, or diffuse.",boundaryTopography:"Examples include smooth, wavy, irregular, or broken.",dryColor:"For example, 10 Y R 5 slash 3 dry.",moistColor:"For example, 10 Y R 3 slash 2 moist."};
function defaults(){const d=new Date();$('date').value=d.toISOString().slice(0,10);$('time').value=d.toTimeString().slice(0,5);$('describedBy').value='JJ Conner'}
function speak(text,done){if(!('speechSynthesis'in window)){voiceStatus.textContent='This browser cannot speak aloud.';done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1;u.onend=()=>done&&done();u.onerror=()=>{voiceStatus.textContent='Voice playback failed. Make sure media volume is turned up.';done&&done()};speechSynthesis.speak(u)}
function testVoiceNow(){voiceStatus.textContent='Testing speaker…';speak('Soil Profile Field Notes voice is working.',()=>voiceStatus.textContent='Voice test finished. If you heard me, tap Test Microphone next.')}
async function testMicNow(){voiceStatus.textContent='Checking microphone permission…';try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());voiceStatus.textContent='Microphone permission is working. Now tap Start Hands-Free.'}catch(e){voiceStatus.textContent='Microphone blocked: '+(e.name||e.message)+'. In Chrome, tap the lock or site controls by the address, then allow Microphone.'}}
function useGPS(){voiceStatus.textContent='Getting current GPS…';navigator.geolocation.getCurrentPosition(p=>{latitude.value=p.coords.latitude.toFixed(6);longitude.value=p.coords.longitude.toFixed(6);voiceStatus.textContent='GPS filled successfully.';saveDraft()},e=>voiceStatus.textContent='GPS problem: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function addHorizon(data={}){const i=state.horizons.length,h=Object.assign({top:'',bottom:'',dryColor:'',moistColor:'',structure:'',texture:'',dryConsistence:'',moistConsistence:'',wetConsistence:'',stickiness:'',boundaryDistinctness:'',boundaryTopography:'',rockPercent:'',rockSize:'',rootsNotes:''},data);state.horizons.push(h);renderHorizons();rebuildQuestions();saveDraft()}
function labelFor(k){return({top:'Top Depth',bottom:'Bottom Depth',dryColor:'Dry Color',moistColor:'Moist Color',structure:'Structure',texture:'Texture',dryConsistence:'Dry Consistence',moistConsistence:'Moist Consistence',wetConsistence:'Wet Consistence',stickiness:'Stickiness',boundaryDistinctness:'Boundary Distinctness',boundaryTopography:'Boundary Topography',rockPercent:'Rock %',rockSize:'Rock Size',rootsNotes:'Roots / Notes'})[k]||k}
function renderHorizons(){horizons.innerHTML='';state.horizons.forEach((h,i)=>{const el=document.createElement('div');el.className='horizon';el.innerHTML=`<h3>Horizon ${i+1}</h3><div class="grid"></div>`;const g=el.querySelector('.grid');horizonFields.forEach(([k])=>{const d=document.createElement('div');d.innerHTML=`<label>${labelFor(k)}</label><input data-h="${i}" data-k="${k}">`;const inp=d.querySelector('input');inp.value=h[k]||'';inp.oninput=e=>{state.horizons[i][k]=e.target.value;saveDraft()};g.appendChild(d)});horizons.appendChild(el)})}
let questions=[];function rebuildQuestions(){questions=detailFields.map(([key,q])=>({scope:'detail',key,q}));state.horizons.forEach((h,i)=>horizonFields.forEach(([key,q])=>questions.push({scope:'horizon',index:i,key,q:q.replace('{n}',i+1)})));if(state.qIndex>=questions.length)state.qIndex=0;showQuestion(false)}
function showQuestion(talk=true){const q=questions[state.qIndex];currentQuestion.textContent=q?q.q:'Add a horizon to continue.';if(talk&&state.voiceActive&&q){voiceStatus.textContent='Speaking question…';speak(q.q,()=>{if(state.voiceActive)setTimeout(startRecognition,250)})}}
function stopRecognition(){if(state.recognition){try{state.recognition.onend=null;state.recognition.abort()}catch(e){}state.recognition=null}state.waiting=false}
function startRecognition(){if(!state.voiceActive||state.waiting)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.voiceActive=false;voiceStatus.textContent='Chrome speech recognition is unavailable on this device.';return}stopRecognition();const r=new SR();state.recognition=r;state.waiting=true;r.lang='en-US';r.continuous=false;r.interimResults=false;r.onstart=()=>voiceStatus.textContent='Listening…';r.onerror=e=>{state.waiting=false;const err=e.error||'unknown';if(err==='not-allowed'||err==='service-not-allowed'){state.voiceActive=false;voiceStatus.textContent='Microphone permission is blocked for this site.'}else if(err==='no-speech'){voiceStatus.textContent='I did not hear anything. Listening again…';if(state.voiceActive)setTimeout(startRecognition,700)}else if(err!=='aborted'){voiceStatus.textContent='Voice recognition problem: '+err;if(state.voiceActive)setTimeout(startRecognition,900)}};r.onend=()=>{state.waiting=false;state.recognition=null};r.onresult=e=>{state.waiting=false;const text=e.results[0][0].transcript.trim();handleHeard(text)};try{r.start()}catch(e){state.waiting=false;voiceStatus.textContent='Could not start microphone: '+e.name}}
function handleHeard(text){const low=text.toLowerCase();if(low==='next'||low.endsWith(' next')){nextQuestion();return}if(low.includes('give me an example')||low==='example'){giveExample();return}const q=questions[state.qIndex];if(!q)return;if(q.scope==='detail')$(q.key).value=text;else{state.horizons[q.index][q.key]=text;const inp=document.querySelector(`input[data-h="${q.index}"][data-k="${q.key}"]`);if(inp)inp.value=text}saveDraft();voiceStatus.textContent='Heard: '+text;speak('I heard '+text+'.',()=>{if(state.voiceActive){state.qIndex=Math.min(state.qIndex+1,questions.length-1);showQuestion(true)}})}
function nextQuestion(){stopRecognition();state.qIndex=Math.min(state.qIndex+1,questions.length-1);showQuestion(true)}
function giveExample(){stopRecognition();const t=examples[questions[state.qIndex]?.key]||'Give the field observation in the words you would normally use.';voiceStatus.textContent=t;speak(t,()=>{if(state.voiceActive)setTimeout(startRecognition,250)})}
function startHandsFree(){stopRecognition();state.voiceActive=true;voiceStatus.textContent='Hands-free mode starting…';const q=questions[state.qIndex];speak('Hands-free mode started. '+(q?q.q:''),()=>{if(state.voiceActive)setTimeout(startRecognition,250)})}
function stopHandsFree(){state.voiceActive=false;stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel();voiceStatus.textContent='Hands-free mode stopped.'}
const KEY='soilProfileFieldNotesDraftV2';function collect(){const out={horizons:state.horizons};['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>out[k]=$(k).value);return out}function saveDraft(){try{localStorage.setItem(KEY,JSON.stringify(collect()))}catch(e){}}function loadData(d){['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>{if(d[k]!=null)$(k).value=d[k]});state.horizons=[];(d.horizons||[]).forEach(h=>addHorizon(h));if(!state.horizons.length)addHorizon();rebuildQuestions()}
function saveJSON(){const b=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Soil-Profile-Field-Notes-'+($('lotTract').value||'Field')+'.json';a.click();URL.revokeObjectURL(a.href)}
startVoice.onclick=startHandsFree;stopVoice.onclick=stopHandsFree;testVoice.onclick=testVoiceNow;testMic.onclick=testMicNow;nextBtn.onclick=nextQuestion;exampleBtn.onclick=giveExample;gpsBtn.onclick=useGPS;addHorizon.onclick=()=>addHorizon();saveJson.onclick=saveJSON;loadJsonBtn.onclick=()=>loadJson.click();loadJson.onchange=async e=>{if(e.target.files[0])loadData(JSON.parse(await e.target.files[0].text()))};document.addEventListener('input',e=>{if(e.target.matches('input,textarea'))saveDraft()});
securityStatus.textContent=location.protocol==='https:'?'Secure HTTPS connection. Field entries stay on this device unless you export them.':'This is not the secure hosted version.';defaults();addHorizon();try{const old=localStorage.getItem(KEY);if(old)loadData(JSON.parse(old))}catch(e){};setTimeout(()=>{if(navigator.geolocation)useGPS()},700);if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
