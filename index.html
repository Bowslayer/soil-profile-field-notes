<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soil Profile Field Notes</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{margin:0;background:#f6f7f8;color:#111}header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:5}h1{margin:0;font-size:1.25rem}main{padding:16px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff}textarea{min-height:74px}button{padding:11px 14px;border-radius:12px;border:1px solid #999;background:#fff}button.primary{background:#111;color:#fff;border-color:#111}.row{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:.95rem;padding:10px 12px;border-radius:10px;background:#eef1f4;margin-top:10px}.question{font-size:1.1rem;font-weight:700;margin:8px 0}.muted{color:#666;font-size:.9rem}.horizon{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}</style></head><body><header><h1>Soil Profile Field Notes</h1><div class="muted">Build 2026-09-02 3:30 PM · Immediate Confirm</div></header><main><section class="card"><div class="row"><button class="primary" id="startVoice">Start Hands-Free</button><button id="stopVoice">Stop</button><button id="testVoice">Test Voice</button><button id="testMic">Test Microphone</button><button id="nextBtn">Next</button><button id="exampleBtn">Give Me an Example</button></div><div class="status" id="voiceStatus">Ready. Tap Start Hands-Free.</div><div class="muted" id="securityStatus" style="margin-top:8px"></div><div class="question" id="currentQuestion"></div><div class="muted">The app repeats your answer, asks “Is that correct?”, and immediately listens. Say yes to accept it, or no/correct it to immediately give the corrected answer.</div></section><section class="card"><h2>Test Pit Details</h2><div class="grid"><div><label>Location</label><input id="location"></div><div><label>Lot / Tract</label><input id="lotTract"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div><div><label>Elevation (ft, USGS 3DEP)</label><input id="elevation"></div><div><label>Aspect</label><input id="aspect"></div><div><label>County</label><input id="county"></div><div><label>Soil Reviewer</label><input id="describedBy" value="JJ Conner"></div><div><label>Latitude</label><input id="latitude"></div><div><label>Longitude</label><input id="longitude"></div></div><div style="margin-top:10px"><label>Vegetation</label><textarea id="vegetation"></textarea></div><div class="row" style="margin-top:10px"><button id="gpsBtn">Use Current GPS + Elevation</button></div></section><section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Soil Horizons</h2><button id="addHorizon">Add Horizon</button></div><div id="horizons"></div></section><section class="card"><div class="row"><button class="primary" id="saveJson">Save Field Notes JSON</button><button id="loadJsonBtn">Load JSON</button><input id="loadJson" type="file" accept=".json,application/json" hidden></div></section></main><script>
const $=id=>document.getElementById(id),state={horizons:[],voiceActive:false,qIndex:0,recognition:null,waiting:false,mode:'answer',pending:null};
const detailFields=[["location","What is the test pit location?"],["lotTract","What is the lot or tract?"],["aspect","What is the aspect?"],["county","What county is the test pit in?"],["vegetation","Describe the vegetation."]];
const horizonFields=[["top","What is the top depth for Horizon {n}?"],["bottom","What is the bottom depth for Horizon {n}?"],["dryColor","What is the dry Munsell color for Horizon {n}?"],["moistColor","What is the moist Munsell color for Horizon {n}?"],["structure","What is the soil structure for Horizon {n}?"],["texture","What is the soil texture for Horizon {n}?"],["dryConsistence","What is the dry consistence for Horizon {n}?"],["moistConsistence","What is the moist consistence for Horizon {n}?"],["wetConsistence","What is the wet consistence for Horizon {n}?"],["stickiness","What is the stickiness for Horizon {n}?"],["boundaryDistinctness","What is the boundary distinctness for Horizon {n}?"],["boundaryTopography","What is the boundary topography for Horizon {n}?"],["rockPercent","What percent rock fragments are present in Horizon {n}?"],["rockSize","What is the rock fragment size for Horizon {n}?"],["rootsNotes","Describe the roots or other notes for Horizon {n}?"]];
const examples={structure:"Examples include massive, platy, prismatic, columnar, blocky, granular, or structureless.",texture:"Examples include sand, loamy sand, sandy loam, loam, silt loam, clay loam, sandy clay, silty clay, or clay.",dryConsistence:"Examples include loose, soft, slightly hard, hard, very hard, or extremely hard.",moistConsistence:"Examples include loose, very friable, friable, firm, very firm, or extremely firm.",stickiness:"Examples include nonsticky, slightly sticky, moderately sticky, or very sticky.",boundaryDistinctness:"Examples include abrupt, clear, gradual, or diffuse.",boundaryTopography:"Examples include smooth, wavy, irregular, or broken.",dryColor:"For example, 10 Y R 5 slash 3 dry.",moistColor:"For example, 10 Y R 3 slash 2 moist."};
function defaults(){const d=new Date();$('date').value=d.toISOString().slice(0,10);$('time').value=d.toTimeString().slice(0,5);$('describedBy').value='JJ Conner'}
function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1.12;u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}
function testVoiceNow(){voiceStatus.textContent='Testing speaker…';speak('Voice is working.',()=>voiceStatus.textContent='Voice test finished.')}
async function testMicNow(){voiceStatus.textContent='Checking microphone…';try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());voiceStatus.textContent='Microphone is working.'}catch(e){voiceStatus.textContent='Microphone blocked. In Chrome site controls, allow Microphone.'}}
async function fillElevation(lat,lon){try{voiceStatus.textContent='Looking up elevation…';const r=await fetch(`https://epqs.nationalmap.gov/v1/json?x=${encodeURIComponent(lon)}&y=${encodeURIComponent(lat)}&units=Feet&wkid=4326&includeDate=false`,{cache:'no-store'});const d=await r.json(),v=Number(d.value);if(!Number.isFinite(v))throw 0;$('elevation').value=Math.round(v);saveDraft();voiceStatus.textContent=`GPS + elevation: ${lat.toFixed(6)}, ${lon.toFixed(6)} · ${Math.round(v)} ft`}catch(e){voiceStatus.textContent='GPS filled; elevation lookup failed.'}}
function useGPS(){voiceStatus.textContent='Getting GPS…';navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lon=p.coords.longitude;$('latitude').value=lat.toFixed(6);$('longitude').value=lon.toFixed(6);saveDraft();fillElevation(lat,lon)},e=>voiceStatus.textContent='GPS problem: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function addHorizon(data={}){const h=Object.assign({top:'',bottom:'',dryColor:'',moistColor:'',structure:'',texture:'',dryConsistence:'',moistConsistence:'',wetConsistence:'',stickiness:'',boundaryDistinctness:'',boundaryTopography:'',rockPercent:'',rockSize:'',rootsNotes:''},data);state.horizons.push(h);renderHorizons();rebuildQuestions();saveDraft()}
function labelFor(k){return({top:'Top Depth',bottom:'Bottom Depth',dryColor:'Dry Color',moistColor:'Moist Color',structure:'Structure',texture:'Texture',dryConsistence:'Dry Consistence',moistConsistence:'Moist Consistence',wetConsistence:'Wet Consistence',stickiness:'Stickiness',boundaryDistinctness:'Boundary Distinctness',boundaryTopography:'Boundary Topography',rockPercent:'Rock %',rockSize:'Rock Size',rootsNotes:'Roots / Notes'})[k]||k}
function renderHorizons(){horizons.innerHTML='';state.horizons.forEach((h,i)=>{const el=document.createElement('div');el.className='horizon';el.innerHTML=`<h3>Horizon ${i+1}</h3><div class="grid"></div>`;const g=el.querySelector('.grid');horizonFields.forEach(([k])=>{const d=document.createElement('div');d.innerHTML=`<label>${labelFor(k)}</label><input data-h="${i}" data-k="${k}">`;const inp=d.querySelector('input');inp.value=h[k]||'';inp.oninput=e=>{state.horizons[i][k]=e.target.value;saveDraft()};g.appendChild(d)});horizons.appendChild(el)})}
let questions=[];function rebuildQuestions(){questions=detailFields.map(([key,q])=>({scope:'detail',key,q}));state.horizons.forEach((h,i)=>horizonFields.forEach(([key,q])=>questions.push({scope:'horizon',index:i,key,q:q.replace('{n}',i+1)})));if(state.qIndex>=questions.length)state.qIndex=0;showQuestion(false)}
function resetAnswerState(){state.mode='answer';state.pending=null}function showQuestion(talk=true){resetAnswerState();const q=questions[state.qIndex];currentQuestion.textContent=q?q.q:'Add a horizon to continue.';if(talk&&state.voiceActive&&q)speak(q.q,()=>{if(state.voiceActive)setTimeout(startRecognition,50)})}
function stopRecognition(){if(state.recognition){try{state.recognition.onend=null;state.recognition.abort()}catch(e){}state.recognition=null}state.waiting=false}
function startRecognition(){if(!state.voiceActive||state.waiting)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.voiceActive=false;voiceStatus.textContent='Speech recognition unavailable.';return}stopRecognition();const r=new SR();state.recognition=r;state.waiting=true;r.lang='en-US';r.continuous=false;r.interimResults=false;r.onstart=()=>voiceStatus.textContent=state.mode==='confirm'?'Listening for yes/no…':state.mode==='correct'?'Listening for correction…':'Listening…';r.onerror=e=>{state.waiting=false;if(e.error==='not-allowed'){state.voiceActive=false;voiceStatus.textContent='Microphone blocked.'}else if(e.error==='no-speech'&&state.voiceActive)setTimeout(startRecognition,250)};r.onend=()=>{state.waiting=false;state.recognition=null};r.onresult=e=>{state.waiting=false;handleHeard(e.results[0][0].transcript.trim())};try{r.start()}catch(e){state.waiting=false}}
function applyAnswer(text){const q=questions[state.qIndex];if(!q)return;if(q.scope==='detail')$(q.key).value=text;else{state.horizons[q.index][q.key]=text;const inp=document.querySelector(`input[data-h="${q.index}"][data-k="${q.key}"]`);if(inp)inp.value=text}saveDraft()}
function askConfirm(text){state.pending=text;state.mode='confirm';voiceStatus.textContent='Heard: '+text;speak(text+'. Is that correct?',()=>{if(state.voiceActive)setTimeout(startRecognition,20)})}
function isYes(x){return ['yes','yeah','yep','correct','right','good','correct yes'].includes(x)}function isNo(x){return x==='no'||x.includes('correct it')||x.includes('wrong')||x.includes('change it')||x.includes('not correct')}
function handleHeard(text){const low=text.toLowerCase().replace(/[.,!?]/g,'').trim();if(state.mode==='confirm'){if(isNo(low)){state.mode='correct';voiceStatus.textContent='Listening for correction…';setTimeout(startRecognition,20);return}if(isYes(low)){voiceStatus.textContent='Confirmed: '+state.pending;state.mode='answer';state.pending=null;state.qIndex=Math.min(state.qIndex+1,questions.length-1);showQuestion(true);return}if(low==='repeat'){askConfirm(state.pending);return}applyAnswer(text);askConfirm(text);return}if(state.mode==='correct'){applyAnswer(text);askConfirm(text);return}if(low==='next'){nextQuestion();return}if(low.includes('give me an example')||low==='example'){giveExample();return}applyAnswer(text);askConfirm(text)}
function nextQuestion(){stopRecognition();state.qIndex=Math.min(state.qIndex+1,questions.length-1);showQuestion(true)}function giveExample(){stopRecognition();const t=examples[questions[state.qIndex]?.key]||'Give the field observation.';speak(t,()=>{if(state.voiceActive)setTimeout(startRecognition,50)})}
function startHandsFree(){stopRecognition();state.voiceActive=true;resetAnswerState();const q=questions[state.qIndex];speak(q?q.q:'Ready.',()=>{if(state.voiceActive)setTimeout(startRecognition,50)})}function stopHandsFree(){state.voiceActive=false;stopRecognition();resetAnswerState();if('speechSynthesis'in window)speechSynthesis.cancel();voiceStatus.textContent='Stopped.'}
const KEY='soilProfileFieldNotesDraftV3';function collect(){const out={horizons:state.horizons,elevationSource:'USGS 3DEP EPQS when auto-filled'};['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>out[k]=$(k).value);return out}function saveDraft(){try{localStorage.setItem(KEY,JSON.stringify(collect()))}catch(e){}}function loadData(d){['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'].forEach(k=>{if(d[k]!=null)$(k).value=d[k]});state.horizons=[];(d.horizons||[]).forEach(h=>addHorizon(h));if(!state.horizons.length)addHorizon();rebuildQuestions()}function saveJSON(){const b=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Soil-Profile-Field-Notes-'+($('lotTract').value||'Field')+'.json';a.click();URL.revokeObjectURL(a.href)}
startVoice.onclick=startHandsFree;stopVoice.onclick=stopHandsFree;testVoice.onclick=testVoiceNow;testMic.onclick=testMicNow;nextBtn.onclick=nextQuestion;exampleBtn.onclick=giveExample;gpsBtn.onclick=useGPS;addHorizon.onclick=()=>addHorizon();saveJson.onclick=saveJSON;loadJsonBtn.onclick=()=>loadJson.click();loadJson.onchange=async e=>{if(e.target.files[0])loadData(JSON.parse(await e.target.files[0].text()))};document.addEventListener('input',e=>{if(e.target.matches('input,textarea'))saveDraft()});securityStatus.textContent='Secure HTTPS. Field entries stay on this device unless exported.';defaults();addHorizon();try{const old=localStorage.getItem(KEY);if(old)loadData(JSON.parse(old))}catch(e){};setTimeout(()=>{if(navigator.geolocation)useGPS()},700);if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
