<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soil Profile Field Notes</title><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{margin:0;background:#f6f7f8;color:#111}header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:5}h1{margin:0;font-size:1.25rem}main{padding:16px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:10px}textarea{min-height:74px}button{padding:11px 14px;border-radius:12px;border:1px solid #999;background:#fff}button.primary{background:#111;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px 12px;border-radius:10px;background:#eef1f4;margin-top:10px}.question{font-size:1.1rem;font-weight:700;margin:8px 0}.muted{color:#666;font-size:.9rem}.horizon{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.active-field{outline:3px solid currentColor;outline-offset:2px}</style></head><body><header><h1>Soil Profile Field Notes</h1><div class="muted">Build 2026-09-02 · Soil Vocabulary + 10YR</div></header><main><section class="card"><div class="row"><button class="primary" id="startVoice">Start Hands-Free</button><button id="stopVoice">Stop</button><button id="testVoice">Test Voice</button><button id="testMic">Test Microphone</button><button id="nextBtn">Next</button><button id="exampleBtn">Give Me an Example</button></div><div class="status" id="voiceStatus">Ready.</div><div class="question" id="currentQuestion"></div><div class="muted">Munsell color defaults to 10YR: say “3 slash 3” or “3 dash 3” and the app records 10YR 3/3. Soil description answers are matched to standard field terms before confirmation.</div></section><section class="card"><h2>Test Pit Details</h2><div class="grid"><div><label>Location</label><input id="location"></div><div><label>Lot / Tract</label><input id="lotTract"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div><div><label>Elevation (ft)</label><input id="elevation"></div><div><label>Aspect</label><input id="aspect"></div><div><label>County</label><input id="county"></div><div><label>Soil Reviewer</label><input id="describedBy" value="JJ Conner"></div><div><label>Latitude</label><input id="latitude"></div><div><label>Longitude</label><input id="longitude"></div></div><div style="margin-top:10px"><label>Vegetation</label><textarea id="vegetation"></textarea></div><div class="row" style="margin-top:10px"><button id="gpsBtn">Refresh GPS + Elevation + County</button></div></section><section class="card"><h2>Soil Horizons</h2><div id="horizons"></div></section><section class="card"><button class="primary" id="saveJson">Save Field Notes JSON</button></section></main><script>
const $=id=>document.getElementById(id),state={horizons:[],voiceActive:false,qIndex:0,mode:'answer',pending:null,depthsSet:false,recognition:null,speaking:false,retry:null};
const detailFields=[['location','What is the test pit location?'],['lotTract','What is the lot or tract?'],['aspect','What is the aspect?'],['county','What county is the test pit in?'],['vegetation','Describe the vegetation.']];
const horizonFields=[['dryColor','What is the dry Munsell color for Horizon {n}?'],['moistColor','What is the moist Munsell color for Horizon {n}?'],['structure','What is the soil structure for Horizon {n}?'],['texture','What is the soil texture for Horizon {n}?'],['dryConsistence','What is the dry consistence for Horizon {n}?'],['moistConsistence','What is the moist consistence for Horizon {n}?'],['wetConsistence','What is the wet consistence for Horizon {n}?'],['stickiness','What is the stickiness for Horizon {n}?'],['boundaryDistinctness','What is the boundary distinctness for Horizon {n}?'],['boundaryTopography','What is the boundary topography for Horizon {n}?'],['rockPercent','What percent rock fragments are present in Horizon {n}?'],['rockSize','What is the rock fragment size for Horizon {n}?'],['rootsNotes','Describe the roots or other notes for Horizon {n}?']];
const vocab={structure:['single grain','massive','weak fine granular','weak medium granular','moderate fine granular','moderate medium granular','strong fine granular','strong medium granular','platy','prismatic','columnar','angular blocky','subangular blocky','granular','structureless'],texture:['sand','loamy sand','sandy loam','loam','silt loam','silt','sandy clay loam','clay loam','silty clay loam','sandy clay','silty clay','clay'],dryConsistence:['loose','soft','slightly hard','hard','very hard','extremely hard'],moistConsistence:['loose','very friable','friable','firm','very firm','extremely firm'],wetConsistence:['nonplastic','slightly plastic','moderately plastic','very plastic'],stickiness:['nonsticky','slightly sticky','moderately sticky','very sticky'],boundaryDistinctness:['abrupt','clear','gradual','diffuse'],boundaryTopography:['smooth','wavy','irregular','broken'],rockSize:['fine gravel','medium gravel','coarse gravel','gravel','cobbles','stones','boulders','channers','flagstones']};
const aliases={'sandy long':'sandy loam','sandy loan':'sandy loam','sandy loom':'sandy loam','clay loan':'clay loam','silty loan':'silty loam','non sticky':'nonsticky','slightly stick':'slightly sticky','very stick':'very sticky','sub angular blocky':'subangular blocky','single-grain':'single grain'};
function words(s){return String(s).toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim()}function dist(a,b){a=words(a);b=words(b);const m=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function closest(t,list){const x=aliases[words(t)]||words(t);let best=list[0],score=1e9;for(const v of list){const s=dist(x,v);if(s<score){score=s;best=v}}return best}
function normalizeColor(t){let s=String(t).toUpperCase().replace(/TEN\s*Y\s*R|10\s*Y\s*R|10YR/g,'').replace(/SLASH/g,'/').replace(/DASH|HYPHEN| TO /g,'/').replace(/-/g,'/').trim();const n=s.match(/(\d+(?:\.\d+)?)\s*[\/]\s*(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);return n?`10YR ${n[1]}/${n[2]}`:t}
function normalizeAnswer(key,t){if(key==='dryColor'||key==='moistColor')return normalizeColor(t);if(key==='rockPercent'){const n=String(t).match(/\d+(?:\.\d+)?/);return n?n[0]+'%':t}if(vocab[key])return closest(t,vocab[key]);return t}
const pad=n=>String(n).padStart(2,'0');function defaults(){const d=new Date();date.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;time.value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;describedBy.value='JJ Conner'}
async function autoGPS(){if(!navigator.geolocation)return;return new Promise(res=>navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;latitude.value=lat.toFixed(6);longitude.value=lon.toFixed(6);try{const r=await fetch(`https://epqs.nationalmap.gov/v1/json?x=${lon}&y=${lat}&units=Feet&wkid=4326`);const d=await r.json();if(Number.isFinite(+d.value))elevation.value=Math.round(+d.value)}catch(e){}try{const r=await fetch(`https://geocoding.geo.census.gov/geocoder/geographies/coordinates?x=${lon}&y=${lat}&benchmark=Public_AR_Current&vintage=Current_Current&format=json`);const d=await r.json();county.value=(d?.result?.geographies?.Counties?.[0]?.NAME||'').replace(/ County$/i,'')}catch(e){}save();res()},()=>res(),{enableHighAccuracy:true,timeout:12000,maximumAge:0}))}
function blank(d={}){return Object.assign({top:'',bottom:'',dryColor:'',moistColor:'',structure:'',texture:'',dryConsistence:'',moistConsistence:'',wetConsistence:'',stickiness:'',boundaryDistinctness:'',boundaryTopography:'',rockPercent:'',rockSize:'',rootsNotes:''},d)}function label(k){return({top:'Top Depth',bottom:'Bottom Depth',dryColor:'Dry Color',moistColor:'Moist Color',structure:'Structure',texture:'Texture',dryConsistence:'Dry Consistence',moistConsistence:'Moist Consistence',wetConsistence:'Wet Consistence',stickiness:'Stickiness',boundaryDistinctness:'Boundary Distinctness',boundaryTopography:'Boundary Topography',rockPercent:'Rock %',rockSize:'Rock Size',rootsNotes:'Roots / Notes'})[k]||k}
function render(){horizons.innerHTML='';state.horizons.forEach((h,i)=>{const e=document.createElement('div');e.className='horizon';e.innerHTML=`<h3>Horizon ${i+1}</h3><div class="grid"></div>`;const g=e.querySelector('.grid');[['top'],['bottom'],...horizonFields].forEach(([k])=>{const w=document.createElement('div');w.innerHTML=`<label>${label(k)}</label><input data-h="${i}" data-k="${k}">`;const x=w.querySelector('input');x.value=h[k];x.oninput=()=>{h[k]=x.value;save()};g.appendChild(w)});horizons.appendChild(e)});buildQ()}
let qs=[];function buildQ(){qs=detailFields.map(([key,q])=>({scope:'detail',key,q}));state.horizons.forEach((h,i)=>horizonFields.forEach(([key,q])=>qs.push({scope:'horizon',i,key,q:q.replace('{n}',i+1)})))}function val(q){return q.scope==='detail'?$(q.key).value:state.horizons[q.i][q.key]}function elem(q){return q.scope==='detail'?$(q.key):document.querySelector(`[data-h="${q.i}"][data-k="${q.key}"]`)}function focus(q){document.querySelectorAll('.active-field').forEach(x=>x.classList.remove('active-field'));const e=elem(q);if(e){e.classList.add('active-field');e.scrollIntoView({behavior:'smooth',block:'center'})}}
function closeMic(){clearTimeout(state.retry);const r=state.recognition;state.recognition=null;if(r)try{r.onend=r.onerror=r.onresult=null;r.abort()}catch(e){}}function speak(t,done){closeMic();state.speaking=true;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.12;u.onend=u.onerror=()=>{state.speaking=false;done&&done()};speechSynthesis.speak(u)}function listen(){if(!state.voiceActive||state.speaking)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;closeMic();const r=new SR();state.recognition=r;r.lang='en-US';let got=false;r.onstart=()=>voiceStatus.textContent='Listening…';r.onresult=e=>{got=true;state.recognition=null;handle(e.results[0][0].transcript.trim())};const retry=()=>{if(!got&&state.voiceActive){voiceStatus.textContent='Reconnecting microphone…';state.retry=setTimeout(listen,250)}};r.onerror=e=>{state.recognition=null;if(e.error==='not-allowed'){state.voiceActive=false;voiceStatus.textContent='Microphone permission blocked.'}else retry()};r.onend=()=>{state.recognition=null;retry()};try{r.start()}catch(e){retry()}}
function ask(){const q=qs[state.qIndex];if(!q)return;state.mode='answer';currentQuestion.textContent=q.q;focus(q);speak(q.q,()=>setTimeout(listen,50))}function firstBlank(start=0){for(let i=start;i<qs.length;i++)if(!String(val(qs[i])||'').trim())return i;return-1}function introBlank(){for(let i=0;i<detailFields.length;i++){const k=detailFields[i][0];if(!$(k).value.trim())return i}return-1}
function askDepths(){state.mode='depths';currentQuestion.textContent='What are the depths of all the soil horizons?';speak('What are the depths of all the soil horizons?',()=>listen())}function setDepths(t){const n=(t.match(/\d+(?:\.\d+)?/g)||[]);if(n.length<2){speak('Please say the horizon depths again.',()=>listen());return}const r=[];for(let i=0;i+1<n.length;i+=2)r.push([n[i],n[i+1]]);state.horizons=r.map(x=>blank({top:x[0],bottom:x[1]}));state.depthsSet=true;render();state.mode='depthConfirm';state.pending=r;speak(r.map(x=>x[0]+' to '+x[1]).join(', ')+'. Is that correct?',()=>listen())}
function apply(t){const q=qs[state.qIndex],v=normalizeAnswer(q.key,t);if(q.scope==='detail')$(q.key).value=v;else state.horizons[q.i][q.key]=v;const e=elem(q);if(e)e.value=v;save();focus(q);return v}function yes(x){return /^(yes|yeah|yep|correct|right|good)$/.test(x)}function no(x){return /^(no|wrong|correct it|change it)$/.test(x)}function afterIntro(){if(!state.depthsSet)return askDepths();const i=qs.findIndex(q=>q.scope==='horizon'&&!val(q));if(i>=0){state.qIndex=i;ask()}}
function handle(t){closeMic();const x=words(t);if(state.mode==='depths')return setDepths(t);if(state.mode==='depthConfirm'){if(yes(x)){state.mode='answer';return afterIntro()}if(no(x)){state.depthsSet=false;state.horizons=[];render();return askDepths()}return setDepths(t)}if(state.mode==='confirm'){if(no(x)){state.mode='correct';return listen()}if(yes(x)){const ib=introBlank();if(ib>=0){state.qIndex=ib;return ask()}if(!state.depthsSet)return afterIntro();const n=firstBlank(state.qIndex+1);if(n>=0){state.qIndex=n;return ask()}voiceStatus.textContent='All questions are filled.';return}const v=apply(t);state.pending=v;return speak(v+'. Is that correct?',()=>listen())}if(state.mode==='correct'){const v=apply(t);state.mode='confirm';return speak(v+'. Is that correct?',()=>listen())}const v=apply(t);state.pending=v;state.mode='confirm';speak(v+'. Is that correct?',()=>listen())}
async function start(){state.voiceActive=true;defaults();await autoGPS();const ib=introBlank();if(ib>=0){state.qIndex=ib;ask()}else afterIntro()}function stop(){state.voiceActive=false;closeMic();speechSynthesis.cancel();voiceStatus.textContent='Stopped.'}function save(){try{localStorage.setItem('soilNotesV8',JSON.stringify({horizons:state.horizons,depthsSet:state.depthsSet,location:location.value,lotTract:lotTract.value,date:date.value,time:time.value,elevation:elevation.value,aspect:aspect.value,county:county.value,vegetation:vegetation.value,describedBy:describedBy.value,latitude:latitude.value,longitude:longitude.value}))}catch(e){}}function load(){try{const d=JSON.parse(localStorage.getItem('soilNotesV8')||'{}');for(const k of ['location','lotTract','date','time','elevation','aspect','county','vegetation','describedBy','latitude','longitude'])if(d[k]!=null)$(k).value=d[k];state.horizons=(d.horizons||[]).map(blank);state.depthsSet=!!d.depthsSet;render()}catch(e){render()}}
startVoice.onclick=start;stopVoice.onclick=stop;testVoice.onclick=()=>speak('Voice is working.');testMic.onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());voiceStatus.textContent='Microphone is working.'}catch(e){voiceStatus.textContent='Microphone blocked.'}};nextBtn.onclick=()=>{const n=firstBlank(state.qIndex+1);if(n>=0){state.qIndex=n;ask()}};exampleBtn.onclick=()=>speak('Please use the standard soil description term.',()=>listen());gpsBtn.onclick=autoGPS;saveJson.onclick=()=>{const b=new Blob([localStorage.getItem('soilNotesV8')||'{}'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Soil-Profile-Field-Notes.json';a.click()};load();defaults();autoGPS();
</script></body></html>
